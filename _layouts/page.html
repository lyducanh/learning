---
layout: default
---

<div class="article-container" id="generic-page">
  <header class="article-header">
    <h1 class="gradient-text">{{ page.title }}</h1>
    {% if page.subtitle %}
    <p style="color: var(--text-muted); font-size: 1.1rem;">{{ page.subtitle }}</p>
    {% endif %}
  </header>

  <div class="article-body">
    {{ content }}
  </div>
</div>
